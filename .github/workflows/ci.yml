name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx tsx tests/showdownPassiveOpponent.smoke.ts
      - run: npx tsx tests/showdownRuntime.smoke.ts
      - run: chromium --version
      - run: for i in 1 2 3; do node tests/browserSmoke.mjs; done
